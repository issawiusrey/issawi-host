<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>وثاق | شركاؤك في النجاح الإداري والقانوني</title>
  <style>
    /* Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f7fa;
      color: #333;
      line-height: 1.6;
      direction: rtl;
    }
    header {
      background-color: #004080;
      color: white;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }
    header .logo {
      font-size: 1.8rem;
      font-weight: bold;
      letter-spacing: 2px;
      cursor: default;
    }
    nav a {
      color: white;
      text-decoration: none;
      margin-left: 25px;
      font-weight: 600;
      transition: color 0.3s ease;
    }
    nav a:hover {
      color: #f9c74f;
    }
    .whatsapp-btn {
      background-color: #25d366;
      color: white;
      padding: 10px 18px;
      border-radius: 30px;
      font-weight: bold;
      text-decoration: none;
      transition: background-color 0.3s ease;
    }
    .whatsapp-btn:hover {
      background-color: #128c34;
    }

    /* Banner Section */
    .banner {
      background: linear-gradient(135deg, #004080 0%, #0070c0 100%);
      color: white;
      padding: 80px 20px;
      text-align: center;
    }
    .banner h1 {
      font-size: 3rem;
      margin-bottom: 15px;
      letter-spacing: 2px;
    }
    .banner p {
      font-size: 1.3rem;
      max-width: 800px;
      margin: auto;
      font-weight: 500;
    }

    /* Container */
    .container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }

    /* Services Section */
    .services {
      display: grid;
      grid-template-columns: repeat(auto-fit,minmax(280px,1fr));
      gap: 25px;
      margin-bottom: 60px;
    }
    .service-card {
      background: white;
      padding: 25px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgb(0 0 0 / 0.1);
      transition: transform 0.3s ease;
    }
    .service-card:hover {
      transform: translateY(-7px);
      box-shadow: 0 8px 20px rgb(0 0 0 / 0.15);
    }
    .service-card h3 {
      color: #004080;
      margin-bottom: 15px;
      font-weight: 700;
    }
    .service-card p {
      color: #555;
      font-size: 1rem;
      line-height: 1.4;
    }

    /* Packages Section */
    .packages {
      margin-bottom: 60px;
    }
    .packages h2 {
      color: #004080;
      margin-bottom: 35px;
      text-align: center;
      font-weight: 700;
      font-size: 2.2rem;
    }
    .package-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit,minmax(280px,1fr));
      gap: 25px;
    }
    .package-card {
      background: white;
      border-radius: 15px;
      box-shadow: 0 6px 15px rgb(0 0 0 / 0.1);
      padding: 30px 20px;
      text-align: center;
      transition: box-shadow 0.3s ease;
      cursor: default;
    }
    .package-card:hover {
      box-shadow: 0 10px 25px rgb(0 0 0 / 0.15);
    }
    .package-card h3 {
      color: #0070c0;
      margin-bottom: 15px;
      font-weight: 700;
      font-size: 1.5rem;
    }
    .package-card ul {
      list-style-type: none;
      color: #444;
      margin-bottom: 20px;
      padding-left: 0;
    }
    .package-card ul li {
      margin-bottom: 10px;
      font-size: 1rem;
    }
    .package-card button {
      background-color: #004080;
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 30px;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .package-card button:hover {
      background-color: #0070c0;
    }

    /* Why Us Section */
    .why-us {
      background-color: #e7f0fc;
      padding: 50px 20px;
      border-radius: 15px;
      text-align: center;
      margin-bottom: 60px;
    }
    .why-us h2 {
      color: #004080;
      margin-bottom: 40px;
      font-size: 2.2rem;
      font-weight: 700;
    }
    .why-us-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
    }
    .why-us-item {
      background: white;
      border-radius: 12px;
      padding: 30px 25px;
      max-width: 300px;
      box-shadow: 0 5px 15px rgb(0 0 0 / 0.1);
      font-weight: 600;
      color: #004080;
      transition: box-shadow 0.3s ease;
    }
    .why-us-item:hover {
      box-shadow: 0 8px 25px rgb(0 0 0 / 0.15);
    }

    /* About Section */
    .about {
      max-width: 900px;
      margin: 0 auto 80px auto;
      padding: 0 20px;
      color: #444;
      font-size: 1.1rem;
      line-height: 1.7;
      text-align: center;
    }

    /* Contact Section */
    .contact {
      background-color: #004080;
      color: white;
      padding: 50px 20px;
      border-radius: 15px;
      max-width: 700px;
      margin: 0 auto 60px auto;
    }
    .contact h2 {
      text-align: center;
      margin-bottom: 35px;
      font-weight: 700;
      font-size: 2rem;
    }
    .contact form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .contact input, .contact textarea {
      padding: 15px;
      border-radius: 8px;
      border: none;
      font-size: 1rem;
    }
    .contact input::placeholder, .contact textarea::placeholder {
      color: #777;
    }
    .contact textarea {
      resize: vertical;
      min-height: 110px;
    }
    .contact button {
      font-weight: 700;
      border-radius: 30px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .contact button[type="submit"] {
      background-color: #f9c74f;
      border: none;
      padding: 15px;
      font-size: 1.1rem;
      color: #004080;
    }
    .contact button[type="submit"]:hover {
      background-color: #e0b93b;
    }
    .contact button[type="button"] {
      background-color: #0072c6;
      border: none;
      padding: 15px;
      font-size: 1.1rem;
      color: white;
    }
    .contact button[type="button"]:hover {
      background-color: #005a9e;
    }

    /* Footer */
    footer {
      background-color: #003366;
      color: white;
      text-align: center;
      padding: 20px 15px;
      font-size: 0.9rem;
    }

    /* Responsive */
    @media (max-width: 768px) {
      header {
        flex-direction: column;
        align-items: flex-start;
      }
      nav {
        margin-top: 12px;
      }
      nav a {
        margin-left: 12px;
        font-size: 0.95rem;
      }
      .banner h1 {
        font-size: 2.2rem;
      }
      .banner p {
        font-size: 1.1rem;
      }
      .why-us-list {
        flex-direction: column;
        gap: 20px;
      }
      .service-card, .package-card {
        padding: 20px 15px;
      }
    }
  </style>
</head>
